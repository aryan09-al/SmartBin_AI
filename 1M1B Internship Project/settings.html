<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Settings · SmartBin AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="bg-[#f3f6f4]"><div id="toast" class="fixed top-5 right-5 z-[9999]"></div><div class="flex min-h-screen"><aside class="hidden lg:flex w-64 shrink-0 bg-white border-r min-h-screen p-4 flex-col"><div class="flex items-center gap-2.5 px-2 py-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-600 to-teal-500 flex items-center justify-center text-white"><i class="fa-solid fa-trash-can"></i></div><p class="font-extrabold">SmartBin <span class="text-green-600">AI</span></p></div><nav class="mt-4 space-y-1 text-sm font-semibold"><a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-gauge-high w-5 text-slate-400"></i>Dashboard</a><a href="monitoring.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-dumpster w-5 text-slate-400"></i>Monitoring</a><a href="predictions.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-brain w-5 text-slate-400"></i>AI Predictions</a><a href="map.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-map-location-dot w-5 text-slate-400"></i>Map</a><a href="alerts.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-bell w-5 text-slate-400"></i ery morning</label><label class="flex items-center gap-3"><input type="checkbox" class="w-5 h-5 accent-green-600">Citizen app overflow reports</label><label class="flex items-center gap-3"><input type="checkbox" checked class="w-5 h-5 accent-green-600">AI retrain weekly on new data</label></div></div><div class="bg-white border rounded-2xl p-6"><h3 class="font-bold">System</h3><div class="grid sm:grid-cols-3 gap-3 mt-4 text-sm"><div class="border rounded-xl p-4"><p class="font-bold">Model v2.4</p><p class="text-xs text-green-600 font-bold">● Healthy · 91.4%</p></div><div class="border rounded-xl p-4"><p class="font-bold">Gateway LoRa-03</p><p class="text-xs text-green-600 font-bold">● Online · 49/50 nodes</p></div><div class="border rounded-xl p-4"><p class="font-bold">Database</p><p class="text-xs text-green-600 font-bold">● 1.2M readings stored</p></div></div></div></main></div></div><script src="data.js"></script></body></html>
