<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Alerts · SmartBin AI</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="bg-[#f3f6f4]"><div id="toast" class="fixed top-5 right-5 z-[9999]"></div><div class="flex min-h-screen"><aside id="sidebar" class="fixed lg:static z-40 w-64 shrink-0 bg-white border-r min-h-screen p-4 flex flex-col"><div class="flex items-center gap-2.5 px-2 py-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-green-600 to-teal-500 flex items-center justify-center text-white"><i class="fa-solid fa-trash-can"></i></div><p class="font-extrabold">SmartBin <span class="text-green-600">AI</span></p></div><nav class="mt-4 space-y-1 text-sm font-semibold"><a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-gauge-high w-5 text-slate-400"></i>Dashboard</a><a href="monitoring.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-dumpster w-5 text-slate-400"></i>Dustbin Monitoring</a><a href="predictions.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-brain w-5 text-slate-400"></i>AI Predictions</a><a href="map.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-map-location-dot w-5 text-slate-400"></i>Map</a><a href="alerts.html" class="sidebar-link active flex items-center gap-3 px-3.5 py-2.5 rounded-xl"><i class="fa-solid fa-bell w-5"></i>Alerts</a><a href="history.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-clock-rotate-left w-5 text-slate-400"></i>Collection History</a><a href="settings.html" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-gear w-5 text-slate-400"></i>Settings</a></nav><a href="index.html" class="text-xs text-slate-400 text-center mt-auto hover:text-green-600">← Back to website</a></aside><div class="flex-1 min-w-0"><header class="glass border-b px-4 sm:px-6 py-3.5"><h1 class="font-extrabold text-lg">Alerts Center</h1><p class="text-xs text-slate-500">Critical · Warning · Information — newest first</p></header><main class="p-4 sm:p-6 max-w-[900px] mx-auto"><div class="flex gap-2 text-xs font-bold mb-4"><button onclick="setL('all',this)" class="lb bg-slate-900 text-white px-4 py-2 rounded-xl">All</button><button onclick="setL('critical',this)" class="lb bg-white border px-4 py-2 rounded-xl">🔴 Critical</button><button onclick="setL('warning',this)" class="lb bg-white border px-4 py-2 rounded-xl">🟡 Warning</button><button onclick="setL('info',this)" class="lb bg-white border px-4 py-2 rounded-xl">🔵 Info</button><button onclick="toast('All alerts marked as read','fa-check-double')" class="ml-auto bg-white border px-4 py-2 rounded-xl">Mark all read</button></div><div id="list" class="space-y-3"></div></main></div></div><script src="data.js"></script><script>let L='all';function setL(l,el){L=l;document.querySelectorAll('.lb').forEach(b=>{if(!b.textContent.includes('Mark'))b.className='lb bg-white border px-4 py-2 rounded-xl';});el.className='lb bg-slate-900 text-white px-4 py-2 rounded-xl';renderA();}
function ac(l){return l==='critical'?'border-red-200 bg-red-50/50':l==='warning'?'border-amber-200 bg-amber-50/50':'border-blue-200 bg-blue-50/50';}
function ic(l){return l==='critical'?'bg-red-500':l==='warning'?'bg-amber-500':'bg-blue-500';}
function renderA(){var list=ALERTS.filter(a=>L==='all'||a.level===L);
document.getElementById('list').innerHTML=list.map(a=>'<div class="fade-in bg-white border '+ac(a.level)+' rounded-2xl p-5 flex gap-4"><div class="w-11 h-11 shrink-0 rounded-xl '+ic(a.level)+' text-white flex items-center justify-center"><i class="fa-solid '+a.icon+'"></i></div><div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><p class="font-bold text-sm">'+a.title+'</p><span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full '+(a.level==='critical'?'bg-red-500 text-white':a.level==='warning'?'bg-amber-400 text-white':'bg-blue-500 text-white')+'">'+a.level+'</span></div><p class="text-sm text-slate-500 mt-1">'+a.desc+'</p><p class="text-[11px] text-slate-400 mt-1.5"><i class="fa-regular fa-clock mr-1"></i>'+a.time+'</p></div><div class="ml-auto flex flex-col gap-2 shrink-0"><button onclick="toast(\'Crew dispatched\',\'fa-truck-fast\')" class="text-[11px] font-bold bg-slate-900 text-white px-3.5 py-2 rounded-lg hover:bg-green-600">Dispatch</button><button onclick="toast(\'Alert snoozed for 1 hr\',\'fa-snooze\')" class="text-[11px] font-bold bg-slate-100 px-3.5 py-2 rounded-lg">Snooze</button></div></div>').join('');}
renderA();</script></body></html>
